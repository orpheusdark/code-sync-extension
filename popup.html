<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSync</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        width: 360px;
        background: linear-gradient(135deg, #020617, #111827 60%, #0f172a);
        color: #f8fafc;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 8px 12px;
        cursor: pointer;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: white;
        transition:
          transform 160ms ease,
          opacity 160ms ease;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button.secondary {
        background: rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
      }
      .panel {
        background: rgba(15, 23, 42, 0.84);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 10px;
        box-shadow: 0 18px 45px rgba(2, 6, 23, 0.18);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .muted {
        color: #94a3b8;
        font-size: 0.85rem;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.16);
        color: #bfdbfe;
        font-size: 0.75rem;
      }
      .grid {
        display: grid;
        gap: 8px;
      }
      input,
      select {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.9);
        color: #f8fafc;
        padding: 8px 10px;
        border-radius: 10px;
      }
      .stat {
        font-size: 1.07rem;
        font-weight: 600;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.16);
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/popup/index.ts"></script>
  </body>
</html>
